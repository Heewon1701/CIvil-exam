<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>토목기사 실기 암기 도우미</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f9;
        }

        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            text-align: center; 
            padding: 15px; 
            background-color: var(--bg-color);
            margin: 0;
            color: #333;
        }

        h2 { margin-top: 30px; color: #2c3e50; letter-spacing: -1px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 0.95rem; }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 30px 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 600px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.6;
            white-space: pre-line;
            word-break: keep-all;
        }

        button { 
            margin: 6px; 
            padding: 14px 24px; 
            font-size: 16px; 
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:active { transform: scale(0.97); }
        .btn-main { background-color: var(--primary-color); color: white; width: 85%; max-width: 320px; }
        .btn-sub { background-color: #fff; color: var(--primary-color); border: 2px solid var(--primary-color); width: 85%; max-width: 320px; }
        .btn-correct { background-color: var(--success-color); color: white; width: 40%; max-width: 150px; }
        .btn-wrong { background-color: var(--danger-color); color: white; width: 40%; max-width: 150px; }
        .btn-home { background-color: #6c757d; color: white; margin-top: 25px; font-size: 14px; }

        input { 
            padding: 16px; 
            width: 85%; 
            max-width: 500px;
            font-size: 18px; 
            border: 2px solid #ddd;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
        }

        #progress { font-weight: bold; margin-bottom: 10px; color: #888; font-size: 0.85rem; }
        #feedback { min-height: 28px; margin: 10px 0; font-weight: bold; font-size: 1.1rem; }
        .hidden { display: none; }

        /* 결과 리스트 스타일 */
        .result-list {
            width: 95%;
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .result-item {
            border-bottom: 1px solid #eee;
            padding: 15px 5px;
        }
        .result-item:last-child { border-bottom: none; }
        .res-q { font-weight: bold; color: #444; margin-bottom: 5px; }
        .res-a { font-size: 0.9rem; color: #666; }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 8px;
            color: white;
        }
        .tag-correct { background-color: var(--success-color); }
        .tag-wrong { background-color: var(--danger-color); }
    </style>
</head>
<body>

<div id="start">
    <h2>🏗️ 토목기사 실기 암기 도우미</h2>
    <p class="subtitle">효율적인 암기를 위한 학습 모드 선택</p>
    <button class="btn-main" onclick="start('card')">📖 1단계: 눈으로 암기 (플래시카드)</button><br>
    <button class="btn-main" onclick="start('typing')">⌨️ 2단계: 손으로 암기 (타이핑)</button><br>
    <button class="btn-sub" onclick="openRandomMenu()">🎲 랜덤 학습 모드</button><br>
    <button class="btn-sub" onclick="startExam()">📝 실전 모의고사 (10문항)</button>
</div>

<div id="randomMenu" class="hidden">
    <h3>🎲 랜덤 학습 설정</h3>
    <div id="methodArea">
        <p class="subtitle">먼저 진행 방식을 선택하세요</p>
        <button class="btn-main" onclick="selectMethod('card')">📖 카드 모드</button><br>
        <button class="btn-main" onclick="selectMethod('typing')">⌨️ 타이핑 모드</button>
    </div>
    <div id="countArea" class="hidden">
        <p class="subtitle" id="selectedMethodText" style="color:var(--primary-color); font-weight:bold;"></p>
        <p class="subtitle">문항 개수를 선택하면 시작합니다</p>
        <button onclick="startRandom(10)">10개</button>
        <button onclick="startRandom(30)">30개</button>
        <button onclick="startRandom(50)">50개</button>
        <button onclick="startRandom(100)">100개</button>
        <button onclick="startRandom(150)">150개</button>
        <button onclick="startRandom('all')">전체</button>
    </div>
    <br>
    <button class="btn-home" onclick="backToStart()">⬅️ 처음으로</button>
</div>

<div id="main" class="hidden">
    <div id="progress"></div>
    <div class="card" id="card"></div>
    <div id="typingArea" class="hidden">
        <input id="input" type="text" placeholder="정답 입력 후 엔터" autocomplete="off">
        <br>
        <button class="btn-main" onclick="check()">확인 (Enter)</button>
    </div>
    <div id="feedback"></div>
    <div id="controlButtons">
        <button id="showBtn" class="btn-main" onclick="showAnswer()">정답 보기 (Enter)</button>
        <div id="markButtons" class="hidden">
            <button class="btn-correct" onclick="mark(true)">✅ 맞음</button>
            <button class="btn-wrong" onclick="mark(false)">❌ 틀림</button>
        </div>
    </div>
    <button class="btn-home" onclick="goHome()">⏮️ 처음으로</button>
</div>

<div id="result" class="hidden">
    <h3>🎯 결과</h3>
    <div class="card" id="resultText"></div>
    <div id="resultListContainer" class="result-list"></div>
    <button class="btn-main" onclick="reviewWrong()">❌ 틀린 문제 복습</button><br>
    <button class="btn-home" onclick="restart()">🔄 처음으로</button>
</div>

<script>
// --- 데이터 섹션 (기존과 동일) ---
const originalCards = [
  {    "q": "기초 지반의 물리적 탐사법의 종류명을 5가지만 쓰시오.",
    "a": "방사능 탐사법 / 탄성파 탐사법 / 중력 탐사법 / 전기 탐사법 / 자기 탐사법"
  },
  {    "q": "암석과 같은 탄성체에 급격한 충격을 가하면 그 충격이 일종의 굴절파 또는 \n반사파가 되어 암석 내의 파쇄대나 단층과 같은 구조물을 탐사하는 방법",
    "a": "탄성파 탐사법"
  },
  {    "q": "신속한 지반 특성을 평가하는 데 유용하게 사용되는 탐사법으로 \n보통 조사보다 비용이 적게 들고 해석이 복잡한 물리탐사법",
    "a": "지진파 굴절 탐사법 / 크로스홀 탄성파 탐사법 / 전기 비저항 탐사법"
  },
  {
    "q": "수평길이 L의 간격으로 땅속에 굴착된 두 개의 홀에 어느하나의 시추공의 \n바닥에서 충격막대에 의해 연직 충격을 발생시켜 연직으로 민감한 \n트랜스듀서에 의해 전단파를기록할 수 있는 지구물리학적인 지반조사 방법",
    "a": "크로스홀 탄성파 탐사법"
  },
  {
    "q": "유기질토의 특징을 3가지만 쓰시오",
    "a": "압축성이 크다 / 2차 압밀량이 크다 / 자연함수비가 200~300%정도이다"
  },
  {
    "q": "팽창성 지반에 기초를 건설할 때 공사방법으로 흙을 치환하는 것과 \n팽창성 흙의 성질을 변화시키는 두 방법을 생각할 수 있다. \n후자의 방법에 대해서 4가지",
    "a": "흙의 안정처리 / 다짐공법 / 살수공법 / 차수벽 설치"
  },
  {
    "q": "암반의 불연속면 종류 3가지",
    "a": "단층 / 층리 / 절리 / 편리 / 벽개 / ⑥ 파쇄대"
  },
  {
    "q": "암반 내에 규칙적으로 깨져있는 불연속면으로 현저하게 움직인 면이 없는 것을\n( ), 불연속면을 따라 현저하게 움직인 불연속면을 ( )",
    "a": "절리, 단층"
  },
  {
    "q": "암반의 초기응력 측정방법 3가지",

  },
  {
    "q": "암반 중에 천공한 보어 홀에 액체를 주입하여 압력을 상승시키고 공벽에 \n균열을 유도하여 현지 지압을 계산하는 방법은?",
    "a": "수압파쇄법"
  },
  {
    "q": "암반의 사면 파괴형태 4가지",

  },
  {
    "q": "급경사 불연속면에 의해 분리된 주상구조를 형성하고 있는 경암암반에서 \n발생되는 파괴",
    "a": "전도파괴"
  },
  {
    "q": "암석의 분류법 4가지",

  {
    "q": "RMR에 의한 암반분류 시 적용되는 평가요소",

  },
  {
    "q": "암반의 공학적 분류방법",

  {

  {

  {

  },
  {
    "q": "RQD값 공식 및 양질판단 %",
    "a": "시그마 10cm 길이 이상 회수된 코어의 길이 / ------------------- / 굴착된 암석의 이론적 길이 / 50~75%"
  },
  {
    "q": "사운딩의 정의",
    "a": "Rod에 붙인 어떤 저항체를 지중에 넣어 타격, 관입, 인발 및 회전할 때의 / 흙의 전단강도를 측정하는 원위치 시험"
  },
  {
    "q": "정적사운딩의 종류 3가지",
    "a": "베인(Vane) 시험기 / 이스키 메터 / 스웨덴식 관입 시험기 / 휴대용 원추 관입 시험기 / 화란식 원추 관입 시험기"
  },
  {
    "q": "연약 점토지반의 전단강도를 지반의 원위치에서 시험하는 현장시험방법 중 \n대표적인 것은",
    "a": "베인시험"
  },
  {
    "q": "N치 측정방법",
    "a": "2개의 쪼개진 샘플링스푼을 붙인 보링보드 위에 높이 76cm에서 / 무게 5kg의 해머로 낙하하여 지중으로 30cm 관입하는데 필요한 / 항타횟수"

  {
    "q": "무게 63.5kg의 해머로 낙하하고 76cm에서 30cm 관입을 요하는 타격수로 \n측정하는 것은",
    "a": "N치"
  },
  {
    "q": "사질토지반에서 표준관입시험의 결과로 측정된 N치로 추정되는 사항을 5가지",
    "a": "상대밀도 / 내부마찰각 / 지지력계수 / 탄성계수 / 침하에 대한 허용지지력"
  },
  {
    "q": "점성토지반에서 표준관입시험 결과 N치로 추정할 수 있는 사항 4가지",

  },
  {
    "q": "점성토의 공학적 특성은 다짐 시 높은 다짐에너지로 다지면 강도가 오히려 \n저하해 비경제적이며, 건조단위중량도 증가하지 않는 상태로 되는 현상",

  },
  {
    "q": "횡방향 지반반력계수 Kh를 구하는 현장시험을 2가지",

  },
  {
    "q": "지반의 변형계수 횡방향 지지력계수 항복하중 등 자연상태 역학적 성질을 \n알기위한 재하시험방법",

  {

  },
  {

  },

  },
  {
    "q": "양수시험의 종류 2가지",

  },
  {
    "q": "주수시험의 종류 2가지",

  },
  {
    "q": "지반개량공법의 기본 원리 5가지",

  },
  {
    "q": "연약지반에서 발생할 수 있는 공학적 문제점 3가지",

  },
  {
    "q": "사질지반 개량을 위해서 진동을 이용한 공법 4가지",

let cards=[], current=0, wrong=[], mode="card", answerVisible=false;
let examMode = false, score = 0, timer, timeLeft = 600, tempMode = "";
// 학습 기록을 저장할 배열 추가
let studyHistory = [];

function start(m){ examMode = false; mode = m; cards = [...originalCards]; initGame(); }
function openRandomMenu(){
    document.getElementById("start").style.display="none";
    document.getElementById("randomMenu").classList.remove("hidden");
    document.getElementById("methodArea").classList.remove("hidden");
    document.getElementById("countArea").classList.add("hidden");
}
function selectMethod(m){
    tempMode = m;
    document.getElementById("methodArea").classList.add("hidden");
    document.getElementById("countArea").classList.remove("hidden");
    document.getElementById("selectedMethodText").innerText = m === 'card' ? "📖 카드 모드 선택됨" : "⌨️ 타이핑 모드 선택됨";
}
function startRandom(count){
    examMode = false; mode = tempMode;
    let shuffled = [...originalCards]; shuffle(shuffled);
    cards = (count === 'all') ? shuffled : shuffled.slice(0, count);
    document.getElementById("randomMenu").classList.add("hidden");
    initGame();
}
function startExam(){
    examMode = true; mode = "typing";
    let shuffled = [...originalCards]; shuffle(shuffled);
    cards = shuffled.slice(0, 10); timeLeft = 600;
    startTimer(); initGame();
}

function initGame() {
    current = 0; wrong = []; score = 0; studyHistory = []; // 기록 초기화
    document.getElementById("start").style.display="none";
    document.getElementById("main").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");
    applyModeUI();
    load();
}

function applyModeUI(){
    document.getElementById("typingArea").classList.toggle("hidden", mode !== "typing");
    document.getElementById("showBtn").style.display = (mode === "card" && !examMode) ? "inline-block" : "none";
    document.getElementById("markButtons").classList.add("hidden");
}

function load(){
    if(current >= cards.length){ showResult(); return; }
    answerVisible = false;
    document.getElementById("feedback").innerText = "";
    document.getElementById("input").value = "";
    
    if(mode === "card") {
        document.getElementById("markButtons").classList.add("hidden");
        document.getElementById("showBtn").style.display = "inline-block";
    }

    if(!examMode) document.getElementById("progress").innerText = `진행도: ${current+1}/${cards.length}`;
    
    document.getElementById("card").innerText = cards[current].q;
    if(mode === "typing") document.getElementById("input").focus();
}

function showAnswer(){ 
    answerVisible = true; 
    let c = cards[current];
    document.getElementById("card").innerHTML = `<small style='color:#888; font-size:0.8rem;'>${c.q}</small><br><br><span style='color:var(--primary-color)'>${c.a}</span>`;
    document.getElementById("markButtons").classList.remove("hidden");
    document.getElementById("showBtn").style.display = "none";
}

function similarity(a, b) {
    if (!a) return 0;
    a = a.replace(/\s+/g, "").toLowerCase(); b = b.replace(/\s+/g, "").toLowerCase();
    let dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) dp[i][0] = i;
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
            dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]) + 1;
        }
    }
    return 1 - dp[a.length][b.length] / Math.max(a.length, b.length);
}

function check(){
    let input = document.getElementById("input").value.trim().toLowerCase();
    let ans = cards[current].a.toLowerCase();
    let isCorrect = (input !== "") && (similarity(input, ans) >= 0.8 || input.includes(ans));

    // 히스토리에 기록
    studyHistory.push({ q: cards[current].q, a: cards[current].a, user: input || "(미입력)", correct: isCorrect });

    if(isCorrect) {
        score++;
        if(!examMode) document.getElementById("feedback").innerHTML = `<span style="color:var(--success-color)">✅ 맞음</span>`;
    } else {
        wrong.push(cards[current]);
        if(!examMode) document.getElementById("feedback").innerHTML = `<span style="color:var(--danger-color)">❌ 틀림 → ${cards[current].a}</span>`;
    }

    current++;
    if(examMode) load();
    else setTimeout(load, 2000);
}

function mark(correct){
    // 카드 모드에서는 사용자가 직접 누르므로 정답 여부와 상관없이 현재 카드 기록
    studyHistory.push({ q: cards[current].q, a: cards[current].a, user: "카드 확인", correct: correct });

    if(!correct) wrong.push(cards[current]);
    else score++;
    current++; 
    load();
}

function startTimer(){
    clearInterval(timer);
    timer = setInterval(()=>{
        timeLeft--;
        let min = Math.floor(timeLeft / 60); let sec = timeLeft % 60;
        document.getElementById("progress").innerText = `⏱ 남은시간 ${min}:${sec < 10 ? '0' + sec : sec} | ${current+1}/${cards.length}`;
        if(timeLeft <= 0){ showResult(); }
    }, 1000);
}

function showResult(){
    clearInterval(timer);
    document.getElementById("main").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("resultText").innerHTML = `맞은 개수: ${score} / ${cards.length}<br>틀린 개수: ${wrong.length}`;

    // 리스트 생성
    let listHtml = "<h4>학습 리포트</h4>";
    studyHistory.forEach((item, index) => {
        const tagClass = item.correct ? "tag-correct" : "tag-wrong";
        const tagText = item.correct ? "맞음" : "틀림";
        listHtml += `
            <div class="result-item">
                <div class="res-q"><span class="status-tag ${tagClass}">${tagText}</span> ${index + 1}. ${item.q}</div>
                <div class="res-a">정답: ${item.a}</div>
                ${mode === 'typing' ? `<div class="res-a" style="color: ${item.correct ? '#4A90E2' : '#dc3545'}">내 답: ${item.user}</div>` : ''}
            </div>
        `;
    });
    document.getElementById("resultListContainer").innerHTML = listHtml;
}

function reviewWrong(){ if(wrong.length===0) return; cards = [...wrong]; initGame(); }
function goHome(){ location.reload(); }
function backToStart(){ location.reload(); }
function restart(){ location.reload(); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

// 키보드 제어
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        const mainVisible = !document.getElementById("main").classList.contains("hidden");
        if(mainVisible) {
            if(mode==="typing") check();
            else if(!answerVisible) showAnswer(); 
        }
    }
});
</script>
